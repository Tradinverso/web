<!DOCTYPE html>
<html>
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<pre id="output" style="font-size:11px;white-space:pre-wrap;word-break:break-word;max-width:100%;"></pre>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function run() {
  const out = document.getElementById('output');
  out.textContent = 'Loading...';
  
  // Fetch the PDF from our project
  const resp = await fetch('uploads/secciones copy.pdf');
  const buffer = await resp.arrayBuffer();
  
  const pdf = await pdfjsLib.getDocument({data: buffer}).promise;
  out.textContent = `Total pages: ${pdf.numPages}\n\n`;
  
  let fullText = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const pageText = content.items.map(item => item.str).join(' ');
    fullText += `\n--- PAGE ${i} ---\n` + pageText + '\n';
  }
  out.textContent = fullText;
  console.log('PDF_TEXT_START');
  console.log(fullText);
  console.log('PDF_TEXT_END');
}
run().catch(e => { document.getElementById('output').textContent = 'Error: ' + e; console.error(e); });
</script>
</body>
</html>
